# Env micromamba per Adriano_graph (pipeline completa: stadi 0 → 5).
#
# Nuovo env pulito:
#   cd Adriano_graph
#   micromamba create -f config/env.yml
#   micromamba activate adriano-kg
#
# Se adriano-kg esiste già ed è "sporco", crea un nome nuovo cambiando `name:` sotto
# (es. adriano-kg-clean) invece di sovrascrivere l'env attuale.
#
# PyTorch CUDA: usiamo --extra-index-url (non --index-url). Con --index-url pip
# cercherebbe TUTTI i pacchetti solo su download.pytorch.org e fallirebbe su PyPI.
# --extra-index-url aggiunge l'indice CUDA mantenendo PyPI come sorgente principale.
#
# Versioni pin = combo testata su adriano-kg (Python 3.10.20).
# Per aggiornare: pip install -U <pkg> e aggiorna il pin qui.

name: adriano-kg
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # --- PyTorch CUDA 13.0 (prima delle altre dipendenze pip) ---
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.12.0+cu130
      # --- Core pipeline (stadi 0 → 4) ---
      - pydantic==2.13.4
      - PyYAML==6.0.3
      - pdfplumber==0.11.9
      - tiktoken==0.12.0
      - anthropic==0.101.0
      - python-dotenv==1.2.2
      # --- Health checkup stadio 3 (tools/extraction_analysis, stage_3-3) ---
      - networkx==3.4.2
      # --- Stadio 5: embedding + judge LLM ---
      - numpy==2.2.6
      - sentence-transformers==5.5.1
      - openai==2.41.0
      # --- Neo4j import (neo4j/import_to_neo4j.py) ---
      - neo4j==5.28.4
      # --- Report Plotly legacy (--html / --plotly in extraction_analysis) ---
      - plotly==6.7.0
