name: adriano-kg
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - jupyterlab
  - ipykernel
  - python-dotenv
  - pip:
      # LlamaIndex core + property graph
      - llama-index>=0.11.0
      - llama-index-core>=0.11.0
      - llama-index-graph-stores-neo4j
      - llama-index-llms-anthropic
      - llama-index-llms-openai
      - llama-index-embeddings-openai
      - llama-index-embeddings-huggingface

      # Neo4j driver (usato da LlamaIndex sotto il cofano, ma utile averlo)
      - neo4j>=5.20

      # Estrazione e modelli di supporto
      - pydantic>=2.5
      - tiktoken
      - pdfplumber>=0.11.0

      # Visualizzazione e debug
      - pyvis
      - networkx
      - matplotlib

      # Utility
      - tqdm
      - rich

      # Stadio 1 cleaning (YAML regole deterministiche)
      - pyyaml>=6